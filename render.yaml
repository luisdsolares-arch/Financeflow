services:
  - type: web
    name: financeflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: SECURITY_HEADERS_ENABLED
        value: "true"
      - key: TRUSTED_HOSTS
        value: '["*"]'
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: financeflow-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: '["https://financeflow-api.onrender.com","capacitor://localhost","http://localhost:5173"]'

databases:
  - name: financeflow-db
    databaseName: financeflow
    user: financeflow
    plan: free
